{% extends "base.html" %}
{% block content %}
<header class="page-head"><h1 class="large-title">Ещё</h1></header>

<div class="group">
  <div class="row">
    <span class="avatar" style="width:52px;height:52px;font-size:19px">{{ user.initials }}</span>
    <span class="grow"><span class="headline">{{ user.full_name }}</span><div class="footnote">{{ user.role.name }} · {{ branding.name }}</div></span>
  </div>
</div>

<div class="group">
  {% for m in menu %}
  <a class="row chevron" href="{{ m.href }}"><span class="tile">{{ icon(m.icon) }}</span><span class="grow">{{ m.title }}</span></a>
  {% endfor %}
</div>

<form method="post" action="/logout"><button class="btn btn-danger btn-block">Выйти</button></form>
{% endblock %}
